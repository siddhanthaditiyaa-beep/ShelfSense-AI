<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Retail Mart AI</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <h1>🏪 Retail Mart AI</h1>
    <p>Sign in to your account</p>

    <div class="auth-error" id="errorMsg"></div>

    <input type="text" id="username" placeholder="Email or username" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button class="btn-primary" onclick="login()">Sign In</button>

    <div class="auth-link">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>
</div>

<!-- Settings FAB -->
<button class="settings-fab" id="settingsFab" onclick="toggleSettings()" title="Settings">⚙️</button>
<div class="settings-panel" id="settingsPanel">
  <h3>🎨 Appearance</h3>
  <div class="theme-option" data-theme="light" onclick="setTheme('light')">
    <span class="theme-option-icon">☀️</span> Light Mode
  </div>
  <div class="theme-option" data-theme="dark" onclick="setTheme('dark')">
    <span class="theme-option-icon">🌙</span> Dark Mode
  </div>
  <div class="theme-option" data-theme="system" onclick="setTheme('system')">
    <span class="theme-option-icon">💻</span> System Default
  </div>
</div>

<script>
async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorMsg = document.getElementById("errorMsg");

  if (!username || !password) {
    errorMsg.style.display = "block";
    errorMsg.innerText = "Please enter both username and password";
    return;
  }

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (!res.ok) {
      errorMsg.style.display = "block";
      errorMsg.innerText = data.message || "Login failed";
      return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("role", data.role);

    if (data.role === "admin") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "customer.html";
    }

  } catch (err) {
    errorMsg.style.display = "block";
    errorMsg.innerText = "Connection error. Please try again.";
  }
}

// Allow Enter key to submit
document.addEventListener("keypress", function(e) {
  if (e.key === "Enter") login();
});
</script>

</body>
</html>
