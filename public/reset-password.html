<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — ShelfSense AI</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
    }
    .reset-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .reset-card h2 { color: var(--accent-primary); margin-bottom: 8px; font-size: 1.6rem; }
    .reset-card p { color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; color: var(--text-primary); margin-bottom: 6px; font-size: 0.9rem; font-weight: 500; }
    .form-group input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-size: 1rem; box-sizing: border-box; }
    .btn-primary { width: 100%; padding: 13px; background: var(--accent-primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn-primary:hover { opacity: 0.9; }
    .message { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.9rem; display: none; }
    .message.success { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid #10b981; }
    .message.error { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid #ef4444; }
    .back-link { display: block; text-align: center; margin-top: 20px; color: var(--accent-primary); text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="reset-card">
    <h2>🔐 Reset Password</h2>
    <p>Enter your new password below. It must be at least 8 characters.</p>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password" />
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password" />
    </div>
    <button class="btn-primary" onclick="submitReset()">Reset Password</button>
    <div class="message" id="message"></div>
    <a href="/login.html" class="back-link">← Back to Login</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    if (!token) {
      document.querySelector(".reset-card p").textContent =
        "❌ Invalid reset link. Please request a new one from the login page.";
      document.querySelector(".btn-primary").disabled = true;
    }

    async function submitReset() {
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!newPassword || !confirmPassword) { showMessage("Please fill in both fields.", "error"); return; }
      if (newPassword !== confirmPassword) { showMessage("Passwords do not match.", "error"); return; }
      if (newPassword.length < 8) { showMessage("Password must be at least 8 characters.", "error"); return; }

      try {
        const res = await fetch("/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();
        if (res.ok) {
          showMessage("✅ " + data.message, "success");
          setTimeout(() => { window.location.href = "/login.html"; }, 3000);
        } else {
          showMessage("❌ " + data.error, "error");
        }
      } catch (err) {
        showMessage("❌ Network error. Please try again.", "error");
      }
    }

    function showMessage(text, type) {
      const el = document.getElementById("message");
      el.textContent = text;
      el.className = "message " + type;
      el.style.display = "block";
    }
  </script>
</body>
</html>
