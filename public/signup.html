<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Retail Mart AI</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --radius: 12px;
      --font: 'DM Sans', system-ui, sans-serif;
    }
    [data-theme="light"], [data-theme="system"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #111827;
      --text2: #6b7280;
      --border: rgba(0,0,0,0.1);
      --input-bg: #f8fafc;
      --input-focus: #ffffff;
      --error-bg: #fef2f2;
      --error-text: #dc2626;
      --error-border: #fecaca;
      --success-bg: #f0fdf4;
      --success-text: #16a34a;
      --success-border: #bbf7d0;
      --field-error: #ef4444;
    }
    [data-theme="dark"] {
      --bg: #0f1117;
      --card: #1a1d26;
      --text: #f1f5f9;
      --text2: #9ca3af;
      --border: rgba(255,255,255,0.08);
      --input-bg: #222536;
      --input-focus: #2a2d3e;
      --error-bg: rgba(220,38,38,0.12);
      --error-text: #f87171;
      --error-border: rgba(220,38,38,0.3);
      --success-bg: rgba(22,163,74,0.12);
      --success-text: #4ade80;
      --success-border: rgba(22,163,74,0.3);
      --field-error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.2s, color 0.2s;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }
    .logo  { text-align: center; margin-bottom: 6px; font-size: 28px; }
    .title { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 14px; color: var(--text2); margin-bottom: 28px; }

    .theme-row {
      display: flex; justify-content: center; gap: 6px; margin-bottom: 24px;
    }
    .theme-btn {
      padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--input-bg); color: var(--text2); font-size: 12px;
      font-weight: 500; cursor: pointer; font-family: var(--font); transition: all 0.15s;
    }
    .theme-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    .alert { display: none; padding: 11px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; margin-bottom: 16px; border: 1px solid; }
    .alert.error   { background: var(--error-bg);   color: var(--error-text);   border-color: var(--error-border); }
    .alert.success { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .field-wrap { position: relative; }
    .field input {
      width: 100%; height: 44px; padding: 0 44px 0 14px;
      border-radius: var(--radius); border: 1.5px solid var(--border);
      background: var(--input-bg); color: var(--text);
      font-family: var(--font); font-size: 14px; outline: none;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      border-color: var(--accent); background: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    .field input.has-error {
      border-color: var(--field-error);
      box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
    }
    .field-msg { font-size: 11px; margin-top: 4px; min-height: 16px; color: var(--field-error); display: none; }
    .field-msg.visible { display: block; }

    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 18px;
      color: var(--text2); padding: 4px; line-height: 1; transition: color 0.15s;
    }
    .toggle-pw:hover { color: var(--text); }

    /* password strength bar */
    .strength-wrap { margin-top: 6px; display: none; }
    .strength-wrap.visible { display: block; }
    .strength-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0%; }
    .strength-label { font-size: 11px; margin-top: 3px; color: var(--text2); }

    .name-row { display: flex; gap: 10px; }
    .name-row .field { flex: 1; }

    .btn {
      width: 100%; height: 46px; border-radius: var(--radius); border: none;
      background: var(--accent); color: white; font-family: var(--font);
      font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: var(--accent-dark); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .link-row { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text2); }
    .link-row a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .link-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">🏪</div>
  <div class="title">Retail Mart AI</div>
  <div class="subtitle">Create your account</div>

  <div class="theme-row">
    <button class="theme-btn" id="tBtn-light"  onclick="setTheme('light')">☀️ Light</button>
    <button class="theme-btn" id="tBtn-system" onclick="setTheme('system')">💻 System</button>
    <button class="theme-btn" id="tBtn-dark"   onclick="setTheme('dark')">🌙 Dark</button>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="name-row">
    <div class="field">
      <label for="fname">First name</label>
      <div class="field-wrap">
        <input type="text" id="fname" placeholder="John"
               autocomplete="given-name"
               onkeydown="handleKey(event,'fname','lname')"
               oninput="clearFieldError('fname')" />
      </div>
      <div class="field-msg" id="fname-msg">Required</div>
    </div>
    <div class="field">
      <label for="lname">Last name</label>
      <div class="field-wrap">
        <input type="text" id="lname" placeholder="Doe"
               autocomplete="family-name"
               onkeydown="handleKey(event,'lname','email')"
               oninput="clearFieldError('lname')" />
      </div>
      <div class="field-msg" id="lname-msg">Required</div>
    </div>
  </div>

  <div class="field">
    <label for="email">Email address</label>
    <div class="field-wrap">
      <input type="email" id="email" placeholder="you@example.com"
             autocomplete="email"
             onkeydown="handleKey(event,'email','password')"
             oninput="clearFieldError('email')" />
    </div>
    <div class="field-msg" id="email-msg">Please enter a valid email</div>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="field-wrap">
      <input type="password" id="password" placeholder="Min. 6 characters"
             autocomplete="new-password"
             onkeydown="handleKey(event,'password',null)"
             oninput="onPasswordInput()" />
      <button class="toggle-pw" type="button" onclick="togglePw('password','pwEye')" tabindex="-1">
        <span id="pwEye">👁️</span>
      </button>
    </div>
    <div class="strength-wrap" id="strengthWrap">
      <div class="strength-bar">
        <div class="strength-fill" id="strengthFill"></div>
      </div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>
    <div class="field-msg" id="password-msg">Password must be at least 6 characters</div>
  </div>

  <button class="btn" id="submitBtn" onclick="signup()">Create Account</button>

  <div class="link-row">
    Already have an account? <a href="login.html">Sign in</a>
  </div>
</div>

<script>
  /* ---- THEME ---- */
  function applyTheme(t) {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', t === 'system' ? (prefersDark ? 'dark' : 'light') : t);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('tBtn-' + t);
    if (btn) btn.classList.add('active');
  }
  function setTheme(t) { localStorage.setItem('rm-theme', t); applyTheme(t); }
  applyTheme(localStorage.getItem('rm-theme') || 'system');
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if ((localStorage.getItem('rm-theme') || 'system') === 'system') applyTheme('system');
  });

  /* ---- SHOW / HIDE PASSWORD ---- */
  function togglePw(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye   = document.getElementById(eyeId);
    if (input.type === 'password') { input.type = 'text';     eye.textContent = '🙈'; }
    else                           { input.type = 'password'; eye.textContent = '👁️'; }
  }

  /* ---- PASSWORD STRENGTH ---- */
  function onPasswordInput() {
    clearFieldError('password');
    const val  = document.getElementById('password').value;
    const wrap = document.getElementById('strengthWrap');
    const fill = document.getElementById('strengthFill');
    const lbl  = document.getElementById('strengthLabel');

    if (!val) { wrap.classList.remove('visible'); return; }
    wrap.classList.add('visible');

    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
      { pct: '20%', color: '#ef4444', label: 'Very weak' },
      { pct: '40%', color: '#f97316', label: 'Weak' },
      { pct: '60%', color: '#eab308', label: 'Fair' },
      { pct: '80%', color: '#22c55e', label: 'Strong' },
      { pct: '100%',color: '#16a34a', label: 'Very strong' },
    ];
    const lvl = levels[Math.min(score - 1, 4)] || levels[0];
    fill.style.width      = lvl.pct;
    fill.style.background = lvl.color;
    lbl.textContent       = lvl.label;
    lbl.style.color       = lvl.color;
  }

  /* ---- ENTER KEY ---- */
  function handleKey(e, currentId, nextId) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (nextId) document.getElementById(nextId).focus();
    else signup();
  }

  /* ---- FIELD HELPERS ---- */
  function showFieldError(id, msg) {
    document.getElementById(id).classList.add('has-error');
    const m = document.getElementById(id + '-msg');
    if (m) { m.textContent = msg; m.classList.add('visible'); }
  }
  function clearFieldError(id) {
    document.getElementById(id).classList.remove('has-error');
    const m = document.getElementById(id + '-msg');
    if (m) m.classList.remove('visible');
  }
  function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.textContent = msg; box.className = 'alert ' + type; box.style.display = 'block';
  }
  function hideAlert() { document.getElementById('alertBox').style.display = 'none'; }

  /* ---- SIGNUP ---- */
  async function signup() {
    hideAlert();
    const fname    = document.getElementById('fname').value.trim();
    const lname    = document.getElementById('lname').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    let valid = true;

    if (!fname)                        { showFieldError('fname',    'First name is required');          valid = false; } else clearFieldError('fname');
    if (!lname)                        { showFieldError('lname',    'Last name is required');           valid = false; } else clearFieldError('lname');
    if (!email || !email.includes('@')){ showFieldError('email',    'Please enter a valid email');      valid = false; } else clearFieldError('email');
    if (!password || password.length < 6){ showFieldError('password','Password must be at least 6 characters'); valid = false; } else clearFieldError('password');

    if (!valid) return;

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Creating account…';

    try {
      const res  = await fetch('/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fname, lname, email, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showAlert(data.message || 'Signup failed. Please try again.', 'error');
        return;
      }

      showAlert('✅ Account created! Redirecting to login…', 'success');
      document.getElementById('alertBox').style.display = 'block';
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);

    } catch (err) {
      showAlert('Connection error. Is the server running?', 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Create Account';
    }
  }
</script>
</body>
</html>
