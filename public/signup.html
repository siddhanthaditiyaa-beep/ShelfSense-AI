<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Retail Mart AI</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <h1>🏪 Retail Mart AI</h1>
    <p>Create your account</p>

    <div class="auth-error" id="errorMsg"></div>

    <input type="text" id="fname" placeholder="First name">
    <input type="text" id="lname" placeholder="Last name">
    <input type="email" id="email" placeholder="Email address" autocomplete="email">
    <input type="password" id="password" placeholder="Password" autocomplete="new-password">
    <button class="btn-primary" onclick="signup()">Create Account</button>

    <div class="auth-link">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<!-- Settings FAB -->
<button class="settings-fab" id="settingsFab" onclick="toggleSettings()" title="Settings">⚙️</button>
<div class="settings-panel" id="settingsPanel">
  <h3>🎨 Appearance</h3>
  <div class="theme-option" data-theme="light" onclick="setTheme('light')">
    <span class="theme-option-icon">☀️</span> Light Mode
  </div>
  <div class="theme-option" data-theme="dark" onclick="setTheme('dark')">
    <span class="theme-option-icon">🌙</span> Dark Mode
  </div>
  <div class="theme-option" data-theme="system" onclick="setTheme('system')">
    <span class="theme-option-icon">💻</span> System Default
  </div>
</div>

<script>
async function signup() {
  const fname = document.getElementById("fname").value.trim();
  const lname = document.getElementById("lname").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorMsg = document.getElementById("errorMsg");

  if (!fname || !lname || !email || !password) {
    errorMsg.style.display = "block";
    errorMsg.innerText = "Please fill in all fields";
    return;
  }

  try {
    const res = await fetch("/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fname, lname, email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      errorMsg.style.display = "block";
      errorMsg.innerText = data.message || "Signup failed";
      return;
    }

    alert("Account created! Please login.");
    window.location.href = "login.html";

  } catch (err) {
    errorMsg.style.display = "block";
    errorMsg.innerText = "Connection error. Please try again.";
  }
}

document.addEventListener("keypress", function(e) {
  if (e.key === "Enter") signup();
});
</script>

</body>
</html>
